    - name: inboxFamilySearchCount
      query:
        baseQuery: SELECT row_to_json(TotalCount) from (SELECT COUNT(result) from
          (
          select f.family_id, pi.createdtime from 
          ug_family f
          INNER JOIN eg_wf_processinstance_v2 pi ON pi.businessid = f.family_id
          LEFT JOIN eg_wf_assignee_v2 assg ON pi.id = assg.processinstanceid
          $where
          AND pi.createdtime IN (select max(createdtime) from eg_wf_processinstance_v2 wf where wf.businessid = f.family_id GROUP BY wf.businessid)
          order by pi.createdtime asc
          ) result) TotalCount
        groupBy:
        orderBy:
      searchParams:
        condition: AND
        params:
          - name: f.tenant_id
            isMandatory: true
            jsonPath: $.searchCriteria.tenantId
          - name: f.family_id
            isMandatory: false
            jsonPath: $.searchCriteria.familyId
          - name: pi.status
            isMandatory: false
