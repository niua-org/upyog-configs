SearchDefinitions:
  moduleName: family-service
  summary: Family Service Inbox API
  version: 1.0.0
  definitions:
    - name: inboxFamilySearch
      query:
        baseQuery: Select row_to_json(result) from
          (
          select DISTINCT(f.family_id) as family_id, pi.createdtime from 
          ug_family as f
          INNER JOIN eg_wf_processinstance_v2 pi ON pi.businessid = f.family_id
          LEFT JOIN eg_wf_assignee_v2 assg ON pi.id = assg.processinstanceid
          $where
          AND pi.createdtime IN (select max(createdtime) from eg_wf_processinstance_v2 wf where wf.businessid = f.family_id GROUP BY wf.businessid)
          order by pi.createdtime asc $pagination
          ) result
        groupBy:
        orderBy:
      searchParams:
        condition: AND
        params:
          - name: f.tenant_id
            isMandatory: true
            jsonPath: $.searchCriteria.tenantId
          - name: f.family_id
            isMandatory: false
            jsonPath: $.searchCriteria.familyId
          - name: pi.status
            isMandatory: false
            jsonPath: $.searchCriteria.status
          - name: assg.assignee
            isMandatory: false
            jsonPath: $.searchCriteria.assignee
          - name: pi.businessservice
            isMandatory: false
            jsonPath: $.searchCriteria.businessservice
        pagination:
          noOfRecords: $.searchCriteria.noOfRecords
          offset: $.searchCriteria.offset

      output:
        jsonFormat: {"ResponseInfo": {},"families": []}
        outJsonPath: $.families
        responseInfoPath: $.ResponseInfo

