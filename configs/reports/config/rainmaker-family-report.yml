ReportDefinitions:
- reportName: FamilyIDCoverageReport
  summary: Family ID Coverage Report
  version: 1.0.0
  moduleName: rainmaker-family
  sourceColumns:
  - name: total_registered_families
    label: rainmaker.family.total_registered_families
    type: number
    source: family
    total: true
  - name: total_registered_members
    label: rainmaker.family.total_registered_members
    type: number
    source: family
    total: true
  - name: families_verified
    label: rainmaker.family.families_verified
    type: number
    source: family
    total: true
  - name: families_pending_verification
    label: rainmaker.family.families_pending_verification
    type: number
    source: family
    total: true
  - name: families_rejected
    label: rainmaker.family.families_rejected
    type: number
    source: family
    total: true
  - name: families_without_status
    label: rainmaker.family.families_without_status
    type: number
    source: family
    total: true
  searchParams:
    - name: fromDate
      label: rainmaker.family.fromDate
      type: epoch
      source: family
      isMandatory: false
      searchClause: AND f.created_time >= $fromDate
    - name: toDate
      label: rainmaker.family.toDate
      type: epoch
      source: family
      isMandatory: false
      searchClause: AND f.created_time <= $toDate
  query: |
    SELECT COUNT(DISTINCT f.family_id) AS total_registered_families,
           COUNT(DISTINCT fm.id) FILTER (WHERE fm.active = TRUE AND fm.status = 'ACTIVE') AS total_registered_members,
           COUNT(DISTINCT f.family_id) FILTER (WHERE f.application_status = 'APPROVED') AS families_verified,
           COUNT(DISTINCT f.family_id) FILTER (WHERE f.application_status = 'PENDING_FOR_APPROVAL') AS families_pending_verification,
           COUNT(DISTINCT f.family_id) FILTER (WHERE f.application_status = 'REJECTED') AS families_rejected,
           COUNT(DISTINCT f.family_id) FILTER (WHERE f.application_status IS NULL) AS families_without_status
    FROM ug_family f
    LEFT JOIN ug_family_member fm ON fm.family_id = f.family_id AND fm.tenant_id = f.tenant_id
    WHERE f.tenant_id = $tenantid
      AND f.status NOT IN ('MERGED', 'SPLIT')
