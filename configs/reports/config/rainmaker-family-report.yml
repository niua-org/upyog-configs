ReportDefinitions:
- reportName: FamilyIDCoverageReport
  summary: Family ID Coverage Report
  version: 1.0.0
  moduleName: rainmaker-family
  sourceColumns:
  - name: total_registered_families
    label: rainmaker.family.total_registered_families
    type: number
    source: family
    total: true
  - name: total_registered_members
    label: rainmaker.family.total_registered_members
    type: number
    source: family
    total: true
  - name: families_verified
    label: rainmaker.family.families_verified
    type: number
    source: family
    total: true
  - name: families_pending_verification
    label: rainmaker.family.families_pending_verification
    type: number
    source: family
    total: true
  - name: families_rejected
    label: rainmaker.family.families_rejected
    type: number
    source: family
    total: true
  searchParams:
    - name: fromDate
      label: rainmaker.family.fromDate
      type: epoch
      source: family
      isMandatory: false
      searchClause: AND wf.createdtime >= $fromDate
    - name: toDate
      label: rainmaker.family.toDate
      type: epoch
      source: family
      isMandatory: false
      searchClause: AND wf.createdtime <= $toDate
  query: |
    SELECT COUNT(DISTINCT wf.businessid) AS total_registered_families, COUNT(DISTINCT CASE WHEN fm.active = TRUE AND fm.status = 'ACTIVE' THEN fm.id END) AS total_registered_members, COUNT(DISTINCT CASE WHEN wf.action = 'APPROVE' THEN wf.businessid END) AS families_verified, COUNT(DISTINCT CASE WHEN wf.action = 'APPLY' AND NOT EXISTS (SELECT 1 FROM eg_wf_processinstance_v2 approved WHERE approved.businessid = wf.businessid AND approved.businessservice = 'family-service' AND approved.action = 'APPROVE' AND approved.tenantid = $tenantid) AND NOT EXISTS (SELECT 1 FROM eg_wf_processinstance_v2 rejected WHERE rejected.businessid = wf.businessid AND rejected.businessservice = 'family-service' AND rejected.action = 'REJECT' AND rejected.tenantid = $tenantid) THEN wf.businessid END) AS families_pending_verification, COUNT(DISTINCT CASE WHEN wf.action = 'REJECT' THEN wf.businessid END) AS families_rejected FROM eg_wf_processinstance_v2 wf LEFT JOIN ug_family_member fm ON fm.family_id = wf.businessid WHERE wf.businessservice = 'family-service' AND wf.tenantid = $tenantid
