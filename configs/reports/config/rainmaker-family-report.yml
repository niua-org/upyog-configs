ReportDefinitions:
- reportName: FamilyIDCoverageReport
  summary: Family ID Coverage Report
  version: 1.0.0
  moduleName: rainmaker-family
  sourceColumns:
  - name: total_registered_families
    label: Total Registered Families
    type: number
    source: family
    total: true
  - name: total_registered_members
    label: Total Registered Members
    type: number
    source: family
    total: true
  - name: families_verified
    label: Families Verified
    type: number
    source: family
    total: true
  - name: families_pending_verification
    label: Families Pending Verification
    type: number
    source: family
    total: true
  - name: families_rejected
    label: Families Rejected
    type: number
    source: family
    total: true
  searchParams:
    - name: fromDate
      label: From Date
      type: epoch
      source: family
      isMandatory: false
      searchClause: AND wf.createdtime >= $fromDate
    - name: toDate
      label: To Date
      type: epoch
      source: family
      isMandatory: false
      searchClause: AND wf.createdtime <= $toDate
  query: |
    SELECT COUNT(DISTINCT wf.businessid) AS total_registered_families, COUNT(DISTINCT fm.id) AS total_registered_members, COUNT(DISTINCT CASE WHEN wf.action = 'APPROVE' THEN wf.businessid END) AS families_verified, COUNT(DISTINCT CASE WHEN wf.action = 'APPLY' AND NOT EXISTS (SELECT 1 FROM eg_wf_processinstance_v2 approved WHERE approved.businessid = wf.businessid AND approved.businessservice = 'family-service' AND approved.action = 'APPROVE') AND NOT EXISTS (SELECT 1 FROM eg_wf_processinstance_v2 rejected WHERE rejected.businessid = wf.businessid AND rejected.businessservice = 'family-service' AND rejected.action = 'REJECT') THEN wf.businessid END) AS families_pending_verification, COUNT(DISTINCT CASE WHEN wf.action = 'REJECT' THEN wf.businessid END) AS families_rejected FROM eg_wf_processinstance_v2 wf LEFT JOIN ug_family_member fm ON fm.family_id = wf.businessid WHERE wf.businessservice = 'family-service'
